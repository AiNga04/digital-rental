spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: false
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never

vnpay:
  tmn-code: ${TMN_CODE}
  hash-secret: ${SECRET_KEY}
  return-url: ${RETURN_URL}

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://www.lenshub.shop}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://www.lenshub.shop,https://lenshub.shop}
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:lenshub-prod}
  activation:
    base-url: ${APP_ACTIVATION_BASE_URL}
    jwt-secret: ${APP_ACTIVATION_JWT_SECRET}
  mail:
    provider: resend
    from: ${APP_MAIL_FROM}
    admin: ${APP_MAIL_ADMIN}
    resend:
      api-key: ${RESEND_API_KEY}
  storage:
    minio:
      internal-endpoint: ${MINIO_INTERNAL_ENDPOINT}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:rental-assets}
  kyc:
    provider: fpt
    fpt:
      api-key: ${FPT_KYC_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
