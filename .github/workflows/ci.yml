name: CI

# Chạy pipeline này mỗi khi có thay đổi được đẩy lên code
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Bước 1: Test Backend
  # ==========================================
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Chạy Test Backend
        working-directory: service/lenshub
        run: ./gradlew --no-daemon clean test

  # ==========================================
  # Bước 2: Build & Lint Frontend
  # ==========================================
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Tải thư viện
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra lỗi cú pháp (Lint)
        working-directory: frontend
        run: pnpm lint

      - name: Build thử Frontend
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_E2EE_ENABLED: ${{ vars.NEXT_PUBLIC_E2EE_ENABLED }}
          NEXT_PUBLIC_SERVER_JWK_X: ${{ vars.NEXT_PUBLIC_SERVER_JWK_X }}
          NEXT_PUBLIC_SERVER_JWK_Y: ${{ vars.NEXT_PUBLIC_SERVER_JWK_Y }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}

  # ==========================================
  # Bước 3: Đẩy Image Backend lên Docker Hub
  # ==========================================
  publish-backend:
    name: Publish backend image
    # Chỉ push lên Docker Hub nếu code được đưa vào nhánh master
    if: github.ref == 'refs/heads/master'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Đóng gói và Đẩy lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: service/lenshub
          file: service/lenshub/Dockerfile
          platforms: linux/amd64
          push: true
          # Tên image trên Docker Hub của bạn (VD: ngaem/digital-rental-backend:prod)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-rental-backend:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-rental-backend:sha-${{ github.sha }}

  # ==========================================
  # Bước 4: Đẩy Image Frontend lên Docker Hub
  # ==========================================
  publish-frontend:
    name: Publish frontend image
    if: github.ref == 'refs/heads/master'
    needs:
      - frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Đóng gói và Đẩy lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          # Tên image trên Docker Hub của bạn (VD: ngaem/digital-rental-frontend:prod)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-rental-frontend:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-rental-frontend:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_E2EE_ENABLED=${{ vars.NEXT_PUBLIC_E2EE_ENABLED }}
            NEXT_PUBLIC_SERVER_JWK_X=${{ vars.NEXT_PUBLIC_SERVER_JWK_X }}
            NEXT_PUBLIC_SERVER_JWK_Y=${{ vars.NEXT_PUBLIC_SERVER_JWK_Y }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${{ vars.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}
