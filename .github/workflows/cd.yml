name: CD

on:
  # Cho phép tự chạy bằng tay từ giao diện GitHub (Actions tab)
  workflow_dispatch:
  
  # Hoặc tự động chạy sau khi CI (Build & Push image) chạy thành công
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    # Chỉ chạy deploy nếu là do người dùng kích hoạt bằng tay hoặc CI (Build) vừa xong và không bị lỗi
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Copy các file cấu hình Docker lên máy chủ EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Copy 2 file cần thiết lên VPS
          source: "docker/docker-compose.prod.yml,docker/nginx.conf"
          target: "/home/${{ secrets.EC2_USERNAME }}/digital-rental"

      - name: SSH vào máy chủ EC2 và Deploy hệ thống
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Di chuyển vào thư mục dự án trên EC2
            cd /home/${{ secrets.EC2_USERNAME }}/digital-rental/docker
            
            # Đảm bảo file .env tồn tại (để không lỗi nếu file chưa có)
            touch .env
            
            # Xóa cấu hình image cũ (nếu có) để tránh bị lặp dòng
            sed -i '/^BACKEND_IMAGE=/d' .env
            sed -i '/^FRONTEND_IMAGE=/d' .env
            
            # Nối (append) tên Image mới vào cuối file .env mà KHÔNG làm mất các biến Database của bạn
            echo "BACKEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/digital-rental-backend:prod" >> .env
            echo "FRONTEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/digital-rental-frontend:prod" >> .env
            
            # Đảm bảo 2 file env này tồn tại
            touch backend.prod.env frontend.prod.env
            
            # (Tuỳ chọn) Đăng nhập Docker Hub (sử dụng sudo để tránh lỗi permission denied)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            
            # Kéo (pull) bản cập nhật image mới nhất từ Docker Hub (dùng sudo)
            sudo docker compose -f docker-compose.prod.yml pull
            
            # Tái khởi động lại toàn bộ hệ thống bằng các image mới (dùng sudo)
            sudo docker compose -f docker-compose.prod.yml up -d --force-recreate frontend backend
            sudo docker compose -f docker-compose.prod.yml restart nginx
