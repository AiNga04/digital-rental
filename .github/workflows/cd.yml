name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Copy docker files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker/docker-compose.prod.yml,docker/nginx.conf"
          target: "/home/${{ secrets.EC2_USERNAME }}/digital-rental"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REPO_OWNER
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/digital-rental/docker
            
            # Setup image tags safely without overwriting other variables in .env
            OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
            touch .env
            grep -v '^BACKEND_IMAGE=' .env | grep -v '^FRONTEND_IMAGE=' > .env.tmp || true
            echo "BACKEND_IMAGE=ghcr.io/$OWNER/digital-rental-backend:prod" >> .env.tmp
            echo "FRONTEND_IMAGE=ghcr.io/$OWNER/digital-rental-frontend:prod" >> .env.tmp
            mv .env.tmp .env
            
            # Create empty env files if they don't exist yet
            touch backend.prod.env frontend.prod.env
            
            # Login to GHCR to pull packages if they are private
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new images and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
