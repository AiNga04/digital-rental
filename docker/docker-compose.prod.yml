services:
  lenshub-postgres:
    image: postgres:15-alpine
    container_name: lenshub_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lenshub_private
    restart: unless-stopped

  lenshub-redis:
    image: redis:7-alpine
    container_name: lenshub_redis_prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - lenshub_private
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: lenshub_minio_prod
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - lenshub_private
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: lenshub_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - lenshub_private
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc admin config set local api cors_allow_origin="https://www.lenshub.shop"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: lenshub_backend_prod
    env_file:
      - ./backend.prod.env
    depends_on:
      - lenshub-postgres
      - lenshub-redis
      - minio
    networks:
      - lenshub_private
    restart: unless-stopped
    mem_limit: 900m
    cpus: "1.0"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: lenshub_frontend_prod
    env_file:
      - ./frontend.prod.env
    depends_on:
      - backend
    networks:
      - lenshub_private
    restart: unless-stopped
    mem_limit: 500m
    cpus: "0.5"

  nginx:
    image: nginx:alpine
    container_name: lenshub_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lenshub_private
    restart: unless-stopped

networks:
  lenshub_private:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: