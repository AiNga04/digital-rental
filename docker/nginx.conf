# Bắt buộc chuyển hướng tất cả HTTP (cổng 80) sang HTTPS (cổng 443)
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Cấu hình API Server
server {
    listen 443 ssl;
    server_name api.lenshub.shop;

    # Đường dẫn tới chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/lenshub.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenshub.shop/privkey.pem;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Cấu hình MinIO Storage
server {
    listen 443 ssl;
    server_name storage.lenshub.shop;

    # Đường dẫn tới chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/lenshub.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenshub.shop/privkey.pem;

    # Cho phép upload file lớn lên MinIO
    client_max_body_size 100M;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Cấu hình Frontend Web
server {
    listen 443 ssl default_server;
    server_name lenshub.shop www.lenshub.shop;

    # Đường dẫn tới chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/lenshub.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lenshub.shop/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
